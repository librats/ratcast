name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libraries:
    name: ${{ matrix.os }} · ${{ matrix.build-type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        build-type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Codecs and the file source (FFmpeg), audio (Opus), screen capture
      # (PipeWire, GIO for the portal), voice processing (WebRTC APM). There is no PipeWire daemon on the
      # runner: those tests skip.
      - name: Install media libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libopus-dev
          libpipewire-0.3-dev libglib2.0-dev dbus libwebrtc-audio-processing-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DRATCAST_BUILD_APP=OFF
          -DRATCAST_BUILD_TESTS=ON
          -DRATCAST_BUILD_BENCH=ON

      # A job per core: a bare --parallel is make's unbounded -j, every file at once,
      # and ~400 MB a test file in Debug outgrows the runner's memory.
      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel 4

      - name: Test
        run: ctest --test-dir build --build-config ${{ matrix.build-type }} --output-on-failure

      # A few emulated paths, through ratcast-netsim (netem's rules in user
      # space, no root): the tools, a feed and the script run end to end.
      - name: Emulated paths
        if: runner.os == 'Linux' && matrix.build-type == 'Release'
        run: >
          python3 bench/netem.py --netsim --feed --transport ratcast --bin build/bin
          --duration 5 local loss-2 cap-6

  windows-media:
    name: windows-latest · Release · vcpkg
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Voice processing (WebRTC APM, through the overlay port), Opus, and
      # pkg-config's tool that finds them. FFmpeg is left out — it takes most
      # of an hour to build — so the codec tests skip; the sound devices, the
      # screen, the cameras and TS feeds are Windows' own and need nothing.
      - name: Install media libraries
        run: >
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install opus pkgconf webrtc-audio-processing
          --overlay-ports=cmake/vcpkg-ports --triplet x64-windows

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DRATCAST_BUILD_APP=OFF -DRATCAST_BUILD_TESTS=ON
          -DRATCAST_WITH_OPUS=ON -DRATCAST_WITH_WEBRTC_APM=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  # The engine's macOS backends with the media libraries, and the app: Apple
  # Silicon, VideoToolbox's encoders on its own API. FFmpeg, Opus and SDL3 from
  # Homebrew; WebRTC's AudioProcessing, which Homebrew has not, through vcpkg's
  # overlay port. The runner has no sound device of its own: BlackHole, a
  # loopback one, is installed, which the sound tests play to and hear from,
  # the other applications' sound too (its leave given as the microphone's).
  # No camera or screen recording leave: those tests skip.
  macos-media:
    name: macos-latest · Release · media and app
    runs-on: macos-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-osx-${{ hashFiles('cmake/vcpkg-ports/**') }}

      # Qt first: its action sets up Python, which replaces PKG_CONFIG_PATH,
      # so vcpkg's folder is added to what it leaves. The release's Qt (6.8
      # links AGL, which Xcode 26's SDK has no longer).
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          modules: 'qtshadertools'
          cache: true

      - name: Install media libraries
        run: |
          brew install ffmpeg opus sdl3
          mkdir -p vcpkg-cache
          vcpkg="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          "$vcpkg/vcpkg" install webrtc-audio-processing --overlay-ports=cmake/vcpkg-ports \
            --triplet arm64-osx --x-install-root="$GITHUB_WORKSPACE/vcpkg-installed"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/vcpkg-installed/arm64-osx/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            >> "$GITHUB_ENV"

      # The leave to hear other applications (a process tap, macOS 14.2) given
      # where the image gives the microphone's: asked for instead, nobody
      # answers, and each tap waits three minutes to be refused. The rows are
      # copied whole, whatever columns this macOS's table has.
      - name: Let the tests hear other applications
        run: |
          for db in "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
                    "/Library/Application Support/com.apple.TCC/TCC.db"; do
            sudo sqlite3 "$db" "
              CREATE TEMP TABLE leave AS SELECT * FROM access WHERE service = 'kTCCServiceMicrophone';
              UPDATE leave SET service = 'kTCCServiceAudioCapture';
              INSERT OR REPLACE INTO access SELECT * FROM leave;" ||
              echo "::warning::cannot change $db"
          done
          sudo killall tccd || true

      # Core Audio loads a device's driver as it starts.
      - name: Install a loopback sound device
        run: |
          brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 2

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DRATCAST_BUILD_APP=ON -DRATCAST_BUILD_TESTS=ON
          -DRATCAST_WITH_FFMPEG=ON -DRATCAST_WITH_OPUS=ON -DRATCAST_WITH_WEBRTC_APM=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A test that crashed says nothing of where: the system's crash report,
      # its threads' stacks, does.
      - name: Crash reports
        if: failure()
        run: |
          for report in ~/Library/Logs/DiagnosticReports/*.ips; do
            [[ -e "$report" ]] || continue
            echo "::group::$(basename "$report")"
            cat "$report"
            echo "::endgroup::"
          done

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Sanitizer options and suppressions come with the test presets.
      - run: >
          sudo apt-get update && sudo apt-get install -y ninja-build pkg-config
          libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libopus-dev
          libpipewire-0.3-dev libglib2.0-dev dbus libwebrtc-audio-processing-dev
      - run: cmake --preset ${{ matrix.preset }} -DRATCAST_BUILD_APP=OFF
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  app:
    name: Desktop app (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools'
          cache: true
      - run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libgl-dev xvfb
          libgl1-mesa-dri
      - run: cmake --preset release -DRATCAST_BUILD_APP=ON -DRATCAST_BUILD_TESTS=ON
      - run: cmake --build --preset release
      # Pictures drawn for real: Mesa's software rasteriser behind Xvfb.
      - name: Video drawing
        run: xvfb-run -a ctest --test-dir build/release -R 'VideoView|VideoNode' --output-on-failure

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: pipx install clang-format==20.1.8
      - name: Check formatting
        run: |
          git ls-files -- '*.h' '*.hpp' '*.cpp' '*.c' '*.mm' ':!:external/**' \
            | xargs --no-run-if-empty clang-format --dry-run --Werror
