name: Release

# The app as people get it: on Windows a folder that runs on a bare system,
# zipped; on Linux an AppImage; on macOS (Apple Silicon) the bundle in a DMG,
# and zipped for the updater. Every push to main leaves them as artifacts (and
# keeps vcpkg's caches warm for the tags, which may read only main's); a v* tag
# makes them a GitHub release.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', 'bench/**', 'website/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

env:
  QT_VERSION: '6.10.*'
  # FFmpeg with all it can do: every GPU's encoders (NVENC, AMF, Quick Sync
  # through oneVPL — their runtimes come with the drivers), software ones for a
  # machine with none (SVT-AV1, libaom, OpenH264), dav1d for AV1. LGPL: no gpl
  # or version3 feature may join them. Built by vcpkg, whose packages are kept
  # between runs as files: FFmpeg alone takes most of an hour.
  FFMPEG: ffmpeg[core,avcodec,avformat,swscale,nvcodec,amf,qsv,dav1d,svt-av1,aom,openh264]
  # What the package check looks for in libavcodec: the encoder table's
  # (engine/src/ffmpeg/video_encoder.cpp) but VideoToolbox's, and dav1d.
  CODECS: >-
    av1_nvenc hevc_nvenc h264_nvenc av1_amf hevc_amf h264_amf av1_qsv hevc_qsv h264_qsv
    libsvtav1 libaom-av1 libopenh264 libdav1d

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VCPKG_TRIPLET: x64-windows-release
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if ("${{ github.ref }}" -match '^refs/tags/v(.+)$') {
            $version = $matches[1]
            # The binaries say the tag's version (CMakeLists.txt, RATCAST_VERSION).
            "version=$version" >> $env:GITHUB_OUTPUT
          } else {
            $version = "dev-$("${{ github.sha }}".Substring(0, 8))"
          }
          # The updater finds the package by this name (app/update/release.h).
          "name=ratcast-$version-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg's packages
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      # Opus, WebRTC's AudioProcessing (the overlay port), SDL3 for
      # ratcast-recv's window, pkg-config's tool that finds them.
      - name: Install media libraries
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install $env:FFMPEG opus pkgconf `
            webrtc-audio-processing sdl3 `
            --overlay-ports=cmake/vcpkg-ports --overlay-triplets=cmake/vcpkg-triplets `
            --triplet $env:VCPKG_TRIPLET --host-triplet $env:VCPKG_TRIPLET
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $files = (Get-ChildItem vcpkg-cache -Recurse -File | Sort-Object Name | ForEach-Object Name) -join "`n"
          $hash = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash(
            [Text.Encoding]::UTF8.GetBytes($files))).Replace('-', '').Substring(0, 16)
          "VCPKG_CACHE_KEY=vcpkg-$env:VCPKG_TRIPLET-$hash" >> $env:GITHUB_ENV

      # Saved under what it holds: a run that built nothing new saves nothing.
      - name: Save vcpkg's packages
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: ${{ env.VCPKG_CACHE_KEY }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TRIPLET"
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DRATCAST_VERSION="${{ steps.version.outputs.version }}"
          -DRATCAST_BUILD_TESTS=OFF -DRATCAST_BUILD_APP=ON
          -DRATCAST_WITH_FFMPEG=ON -DRATCAST_WITH_OPUS=ON -DRATCAST_WITH_WEBRTC_APM=ON
          -DRATCAST_UPDATES=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      # The programs, the DLLs they import, Qt's with its plugins and QML
      # modules, MSVC's runtime (cmake/RatcastInstall.cmake).
      - name: Install
        run: |
          # Absolute: Qt's deploy script refuses a relative prefix.
          $dir = "${{ github.workspace }}/package/${{ steps.version.outputs.name }}"
          cmake --install build --config RelWithDebInfo --prefix $dir
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item LICENSE "$dir/licenses/ratcast.txt"
          Get-ChildItem "$env:VCPKG_INSTALLATION_ROOT/installed/$env:VCPKG_TRIPLET/share/*/copyright" |
            ForEach-Object { Copy-Item $_ "$dir/licenses/$($_.Directory.Name).txt" }

      # What the folder must do on a machine with nothing installed: start with
      # Windows' own PATH and no Qt around, and carry every codec — D3D11VA's
      # decoders too, FFmpeg's own on Windows.
      - name: Check the package
        run: |
          $dir = (Resolve-Path "package/${{ steps.version.outputs.name }}").Path

          # The updater fetches from GitHub over TLS: Windows' own, through Qt's plugin.
          if (-not (Test-Path "$dir/plugins/tls/qschannelbackend.dll")) { throw "Qt's TLS plugin is not in the package" }

          $avcodec = Get-ChildItem "$dir/avcodec-*.dll" | Select-Object -First 1
          if (-not $avcodec) { throw "FFmpeg's libavcodec is not in the package" }
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($avcodec.FullName))
          if (-not $text.Contains("LGPL version 2.1 or later")) { throw "$($avcodec.Name) is not LGPL 2.1" }
          $missing = (-split $env:CODECS) + @('h264_d3d11va', 'hevc_d3d11va', 'av1_d3d11va') |
            Where-Object { -not $text.Contains("$_`0") }
          if ($missing) { throw "Missing from $($avcodec.Name): $($missing -join ', ')" }

          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH, Env:QML2_IMPORT_PATH -ErrorAction SilentlyContinue
          foreach ($tool in 'ratcast-send', 'ratcast-recv') {
            & "$dir/$tool.exe" --help | Out-Null
            if ($LASTEXITCODE) { throw "$tool.exe --help: exit code $LASTEXITCODE" }
          }
          # The app quits if its QML fails to load; still up, it found it all.
          $env:QSG_RHI_PREFER_SOFTWARE_RENDERER = '1'  # no GPU on the runner: WARP
          $app = Start-Process "$dir/ratcast.exe" -WorkingDirectory $env:RUNNER_TEMP -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { throw "ratcast.exe quit at start: exit code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force

      - name: Zip
        run: |
          $name = "${{ steps.version.outputs.name }}"
          7z a -tzip "$name.zip" "./package/$name"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          7z a -tzip "$name-symbols.zip" ./build/bin/RelWithDebInfo/ratcast*.pdb

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.zip
            ${{ steps.version.outputs.name }}-symbols.zip
          compression-level: 0  # zips already
          retention-days: 30

  linux:
    name: Linux x64
    # An AppImage runs where glibc and PipeWire are at least this system's
    # (2.39, 1.0): Ubuntu 24.04, Debian 13, Fedora 40 and later.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VCPKG_TRIPLET: x64-linux-dynamic-release
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            # The binaries say the tag's version (CMakeLists.txt, RATCAST_VERSION).
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version="dev-${GITHUB_SHA::8}"
          fi
          # The updater finds the package by this name (app/update/release.h).
          echo "name=ratcast-$version-linux-x86_64" >> "$GITHUB_OUTPUT"

      # From the system: PipeWire and GIO (the AppImage uses the machine's, as
      # its daemon and desktop are), what vcpkg builds with, what Qt's xcb
      # platform links, and Xvfb with Mesa for the package check.
      - name: Install system packages
        run: >
          sudo apt-get update && sudo apt-get install -y ninja-build pkg-config nasm
          autoconf-archive libpipewire-0.3-dev libglib2.0-dev libgl-dev libegl-dev
          libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
          libxcb-randr0 xvfb libgl1-mesa-dri

      - name: Restore vcpkg's packages
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      - name: Install media libraries
        run: |
          mkdir -p vcpkg-cache
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install "$FFMPEG" opus webrtc-audio-processing \
            --overlay-ports=cmake/vcpkg-ports --overlay-triplets=cmake/vcpkg-triplets \
            --triplet "$VCPKG_TRIPLET" --host-triplet "$VCPKG_TRIPLET"
          hash=$(find vcpkg-cache -type f -printf '%f\n' | sort | sha256sum | cut -c1-16)
          echo "VCPKG_CACHE_KEY=vcpkg-$VCPKG_TRIPLET-$hash" >> "$GITHUB_ENV"

      - name: Save vcpkg's packages
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: ${{ env.VCPKG_CACHE_KEY }}

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DRATCAST_VERSION="${{ steps.version.outputs.version }}"
          -DRATCAST_BUILD_TESTS=OFF -DRATCAST_BUILD_TOOLS=OFF -DRATCAST_BUILD_APP=ON
          -DRATCAST_WITH_FFMPEG=ON -DRATCAST_WITH_OPUS=ON -DRATCAST_WITH_WEBRTC_APM=ON
          -DRATCAST_UPDATES=ON
          -DRATCAST_WITH_PIPEWIRE=ON

      - name: Build
        run: cmake --build build --parallel

      # The app, its menu entry and icon into an AppDir; linuxdeploy brings
      # the libraries it links (vcpkg's and Qt's, but the system's own:
      # PipeWire, GLib, GL, X), Qt's plugins and the QML modules Main.qml
      # imports, and packs it. Its symbols go aside.
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'  # no FUSE on the runner
          NO_STRIP: '1'  # linuxdeploy's strip is older than this system's binaries
          QML_SOURCES_PATHS: ${{ github.workspace }}/app/qml
        run: |
          name="${{ steps.version.outputs.name }}"
          DESTDIR=AppDir cmake --install build --prefix /usr
          objcopy --only-keep-debug AppDir/usr/bin/ratcast ratcast.debug
          strip --strip-unneeded AppDir/usr/bin/ratcast
          tar -czf "$name-symbols.tar.gz" ratcast.debug

          licenses=AppDir/usr/share/licenses/ratcast
          mkdir -p "$licenses"
          cp LICENSE "$licenses/ratcast.txt"
          for copyright in "$VCPKG_INSTALLATION_ROOT/installed/$VCPKG_TRIPLET"/share/*/copyright; do
            cp "$copyright" "$licenses/$(basename "$(dirname "$copyright")").txt"
          done

          for tool in linuxdeploy linuxdeploy-plugin-qt linuxdeploy-plugin-appimage; do
            curl -fsSL -o "$tool" \
              "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-x86_64.AppImage"
            chmod +x "$tool"
          done
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$VCPKG_INSTALLATION_ROOT/installed/$VCPKG_TRIPLET/lib"
          export OUTPUT="$name.AppImage"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage \
            --exclude-library 'libpipewire-0.3.so*' \
            --exclude-library 'libglib-2.0.so*' --exclude-library 'libgobject-2.0.so*' \
            --exclude-library 'libgio-2.0.so*' --exclude-library 'libgmodule-2.0.so*'

      # What the AppImage must do: carry every codec, and start on a display
      # with none of Qt or vcpkg around.
      - name: Check the package
        run: |
          name="${{ steps.version.outputs.name }}"
          # The updater fetches from GitHub over TLS: the system's OpenSSL,
          # through Qt's plugin.
          ls AppDir/usr/plugins/tls/libqopensslbackend.so > /dev/null ||
            { echo "::error::Qt's TLS plugin is not in the AppImage"; exit 1; }
          avcodec=$(ls AppDir/usr/lib/libavcodec.so.* | head -n 1)
          strings -n 4 "$avcodec" > avcodec.strings
          grep -qF "LGPL version 2.1 or later" avcodec.strings ||
            { echo "::error::$avcodec is not LGPL 2.1"; exit 1; }
          missing=""
          for codec in $CODECS; do
            grep -qxF "$codec" avcodec.strings || missing="$missing $codec"
          done
          if [[ -n "$missing" ]]; then echo "::error::Missing from $avcodec:$missing"; exit 1; fi

          # The app quits if its QML fails to load; still up, it found it all.
          unset LD_LIBRARY_PATH QT_PLUGIN_PATH QML2_IMPORT_PATH
          status=0
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 10 "./$name.AppImage" || status=$?
          if [[ $status -ne 124 ]]; then echo "::error::ratcast quit at start: exit code $status"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.AppImage
            ${{ steps.version.outputs.name }}-symbols.tar.gz
          retention-days: 30

  macos:
    name: macOS arm64
    # The bundle runs on macOS 14 and later (CMAKE_OSX_DEPLOYMENT_TARGET), on
    # Apple Silicon. Signed ad hoc, not notarized: a first start is opened from
    # the Finder's menu (README's "Download").
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      VCPKG_TRIPLET: arm64-osx-dynamic-release
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      # FFmpeg as on the other systems, but the GPU encoders of PCs: on macOS
      # VideoToolbox's are opened on its own API (engine/src/macos).
      FFMPEG_MACOS: ffmpeg[core,avcodec,avformat,swscale,dav1d,svt-av1,aom,openh264]
      CODECS_MACOS: libsvtav1 libaom-av1 libopenh264 libdav1d
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v(.+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            # The binaries say the tag's version (CMakeLists.txt, RATCAST_VERSION).
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            version="dev-${GITHUB_SHA::8}"
          fi
          # The updater finds the package by this name (app/update/release.h).
          echo "name=ratcast-$version-macos-arm64" >> "$GITHUB_OUTPUT"

      - name: Restore vcpkg's packages
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ env.VCPKG_TRIPLET }}-
          restore-keys: vcpkg-${{ env.VCPKG_TRIPLET }}-

      # Qt first: its action sets up Python, which would change what vcpkg's
      # meson builds run with.
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtshadertools
          cache: true

      - name: Install media libraries
        run: |
          mkdir -p vcpkg-cache
          vcpkg="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
          echo "VCPKG_ROOT=$vcpkg" >> "$GITHUB_ENV"
          "$vcpkg/vcpkg" install "$FFMPEG_MACOS" opus webrtc-audio-processing \
            --overlay-ports=cmake/vcpkg-ports --overlay-triplets=cmake/vcpkg-triplets \
            --triplet "$VCPKG_TRIPLET" --host-triplet "$VCPKG_TRIPLET"
          hash=$(find vcpkg-cache -type f -exec basename {} \; | sort | shasum -a 256 | cut -c1-16)
          echo "VCPKG_CACHE_KEY=vcpkg-$VCPKG_TRIPLET-$hash" >> "$GITHUB_ENV"

      - name: Save vcpkg's packages
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: ${{ env.VCPKG_CACHE_KEY }}

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DRATCAST_VERSION="${{ steps.version.outputs.version }}"
          -DRATCAST_BUILD_TESTS=OFF -DRATCAST_BUILD_TOOLS=OFF -DRATCAST_BUILD_APP=ON
          -DRATCAST_WITH_FFMPEG=ON -DRATCAST_WITH_OPUS=ON -DRATCAST_WITH_WEBRTC_APM=ON
          -DRATCAST_UPDATES=ON

      - name: Build
        run: cmake --build build --parallel

      # The bundle with Qt and the libraries it links inside (macdeployqt,
      # through Qt's deploy script in app/), its symbols aside, the licenses
      # in its Resources, signed ad hoc as a whole: Apple Silicon runs nothing
      # unsigned, and what macdeployqt rewrote is signed anew.
      - name: Bundle
        run: |
          name="${{ steps.version.outputs.name }}"
          # Absolute: Qt's deploy script refuses a relative prefix.
          cmake --install build --prefix "$GITHUB_WORKSPACE/package"
          app=package/ratcast.app
          dsymutil "$app/Contents/MacOS/ratcast" -o ratcast.dSYM
          strip -S "$app/Contents/MacOS/ratcast"
          tar -czf "$name-symbols.tar.gz" ratcast.dSYM

          licenses="$app/Contents/Resources/licenses"
          mkdir -p "$licenses"
          cp LICENSE "$licenses/ratcast.txt"
          for copyright in "$VCPKG_ROOT/installed/$VCPKG_TRIPLET"/share/*/copyright; do
            cp "$copyright" "$licenses/$(basename "$(dirname "$copyright")").txt"
          done

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

      # What the bundle must do on a Mac with nothing installed: load nothing
      # from where it was built, carry every codec, and start.
      - name: Check the package
        run: |
          app=package/ratcast.app
          # The updater fetches from GitHub over TLS: the system's, through Qt's plugin.
          ls "$app"/Contents/PlugIns/tls/libqsecuretransportbackend.dylib > /dev/null ||
            { echo "::error::Qt's TLS plugin is not in the bundle"; exit 1; }
          # Every library linked from the system's places or the bundle's own.
          outside=$(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) -print0 |
            xargs -0 otool -L 2> /dev/null |
            grep -E '^\s+/' | grep -vE '^\s+(/System/|/usr/lib/)' | sort -u || true)
          if [[ -n "$outside" ]]; then echo "::error::Linked from outside:"; echo "$outside"; exit 1; fi

          avcodec=$(ls "$app"/Contents/Frameworks/libavcodec*.dylib | head -n 1)
          strings -n 4 "$avcodec" > avcodec.strings
          grep -qF "LGPL version 2.1 or later" avcodec.strings ||
            { echo "::error::$avcodec is not LGPL 2.1"; exit 1; }
          missing=""
          for codec in $CODECS_MACOS; do
            grep -qxF "$codec" avcodec.strings || missing="$missing $codec"
          done
          if [[ -n "$missing" ]]; then echo "::error::Missing from $avcodec:$missing"; exit 1; fi

          # The app quits if its QML fails to load; still up, it found it all.
          unset QT_PLUGIN_PATH QML2_IMPORT_PATH DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          "$app/Contents/MacOS/ratcast" &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2> /dev/null; then
            wait "$pid"; echo "::error::ratcast quit at start: exit code $?"; exit 1
          fi
          kill "$pid"

      # A DMG to drag the app from into Applications; the same bundle zipped
      # for the updater, by ditto, which keeps the frameworks' links.
      - name: Package
        run: |
          name="${{ steps.version.outputs.name }}"
          mkdir dmg
          cp -R package/ratcast.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ratcast -srcfolder dmg -format UDZO -ov "$name.dmg"
          ditto -c -k --keepParent package/ratcast.app "$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            ${{ steps.version.outputs.name }}.dmg
            ${{ steps.version.outputs.name }}.zip
            ${{ steps.version.outputs.name }}-symbols.tar.gz
          compression-level: 0  # compressed already
          retention-days: 30

  release:
    name: GitHub release
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
